<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vendor/web-style.css"><title>Bainsla Remote · Remote viewer</title></head><body class="electron-viewer" data-viewer="false"><header class="viewer-bar"><a class="brand" href="index.html">Bainsla<span>Remote</span></a><span id="viewer-status" class="status">Connecting…</span><div class="viewer-tools"><select id="screen-select"><option>Screen</option></select><select id="quality-select"><option value="auto">Auto</option><option value="high">High</option><option value="balanced">Balanced</option><option value="low">Low</option></select><select id="shortcut-select"><option value="">Shortcuts</option><option value="cad">Ctrl+Alt+Del</option><option value="win">Windows key</option><option value="alt-tab">Alt+Tab</option><option value="printscreen">Print screen</option></select><button id="clipboard-button">Clipboard</button><button id="chat-toggle">Chat</button><label class="button file-button">Send file<input id="file-input" type="file" hidden></label><button id="keyboard-button" class="keyboard-button">⌨</button><span class="zoom-group" role="group" aria-label="Zoom"><button id="zoom-out" title="Zoom out (Ctrl -)">−</button><button id="zoom-label" title="Fit to window / 100%">Fit</button><button id="zoom-in" title="Zoom in (Ctrl +)">+</button></span><button id="fullscreen-button">⛶</button><button id="disconnect-button" class="button danger">Disconnect</button><span id="connection-stats"></span></div></header><main class="viewer-layout"><section class="remote-stage"><div class="connect-card"><h1>Connect to a Desk</h1><input id="target-id" placeholder="9-digit Desk ID"><input id="viewer-password" type="password" placeholder="Password (if required)"><button id="connect-button" class="button primary">Connect</button></div><video id="remote-video" autoplay playsinline tabindex="0"></video><input id="mobile-keyboard" class="mobile-keyboard-input" aria-label="On-screen keyboard input" autocomplete="off"><div class="viewer-help">Click the desktop, then type · Ctrl + scroll to zoom · Drop files to send</div></section><aside id="chat-panel" class="chat-panel"><h2>Chat</h2><div id="chat-messages" class="chat-messages"></div><form id="chat-form"><input id="chat-input" placeholder="Message"><button class="button primary">Send</button></form></aside></main><script src="viewer-renderer.js"></script></body></html>
