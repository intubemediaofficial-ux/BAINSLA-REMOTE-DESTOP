<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>Incoming request</title></head>
<body class="popup"><div class="request-card"><div class="request-icon">↗</div><span class="label">INCOMING CONNECTION</span><h1 id="viewer">Someone</h1><p id="viewer-id"></p><p class="popup-copy">wants to connect to your computer.</p><div class="permissions"><label><input id="control" type="checkbox" checked> Allow control</label><label><input id="clipboard" type="checkbox" checked> Clipboard</label><label><input id="files" type="checkbox" checked> File transfer</label></div><div class="countdown">Request expires in <strong id="countdown">30</strong>s</div><div class="popup-actions"><button id="reject" class="button secondary">Reject</button><button id="accept" class="button primary">Accept</button></div></div><script src="request.js"></script></body></html>
