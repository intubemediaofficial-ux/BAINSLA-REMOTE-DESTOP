# /etc/turnserver.conf for coturn. static-auth-secret must equal TURN_SECRET in .env
listening-port=3478
external-ip=SERVER_PUBLIC_IP
min-port=49160
max-port=49400
use-auth-secret
static-auth-secret=SAME_AS_TURN_SECRET
realm=remote.example.com
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
log-file=/var/log/turnserver.log
simple-log
