server {
  server_name remote.162.35.107.192.sslip.io remote.bainslamusic.com;
  client_max_body_size 50m;
  location = / { root /opt/bainsla-remote/site; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location /download/ { alias /opt/bainsla-remote/site/download/; add_header Cache-Control "no-cache"; }
  location /ws/id { proxy_pass http://127.0.0.1:21118; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 1d; }
  location /ws/relay { proxy_pass http://127.0.0.1:21119; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 1d; }
  location = /webclient-config/index.js { alias /opt/bainsla-remote/site/webclient-config.js; default_type application/javascript; add_header Cache-Control "no-store"; }
  location /webclient/ { proxy_pass http://127.0.0.1:21114; proxy_set_header Host $host; proxy_hide_header Cache-Control; add_header Cache-Control "no-cache"; }
  location / { proxy_pass http://127.0.0.1:21114; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/remote.162.35.107.192.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/remote.162.35.107.192.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = remote.162.35.107.192.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name remote.162.35.107.192.sslip.io remote.bainslamusic.com;
    return 404; # managed by Certbot


}
